version: "3.9"

services:
  ralph-run:
    image: ${RALPH_RUNNER_IMAGE:-ubuntu:22.04}
    working_dir: /app/dest_repo
    environment:
      - DEST_REPO=/app/dest_repo
    entrypoint: ["/bin/bash", "-lc"]
    command: ["/app/ralph.sh --tool opencode 10"]
    volumes:
      - ${RALPH_REPO_HOST_PATH:?Set absolute path to Ralph repo}:/app:ro # Mount Ralph repo read-only
      - ${DEST_REPO_HOST_PATH:?Set absolute path to destination repo}:/app/dest_repo # Mount destination repo read/write
