version: "3.9"

services:
  ralph-run:
    build:
      context: .
      dockerfile: Dockerfile.ralph-run
    image: ${RALPH_RUNNER_IMAGE:-ralph-run:local}
    working_dir: /app/dest_repo
    environment:
      - DEST_REPO=/app/dest_repo
      - RALPH_ARGS
    entrypoint: ["/bin/bash", "-lc"]
    command: ["/app/ralph.sh ${RALPH_ARGS:---tool opencode 10}"]
    volumes:
      - ${RALPH_REPO_HOST_PATH:?Set absolute path to Ralph repo}:/app:ro
      - ${RALPH_DEST_REPO:?Set absolute path to destination repo}:/app/dest_repo
      - ${OPENCODE_CONFIG_PATH:-$HOME/.config/opencode}:/root/.config/opencode:ro
